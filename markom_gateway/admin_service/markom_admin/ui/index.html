<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarKom Gateway</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <a href="#page-content" class="skip-link">Skip to main content</a>
    <div id="app" class="layout">
        <aside id="sidebar" class="sidebar" role="complementary" aria-label="Navigation sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo" aria-hidden="true">M</div>
                <span class="brand-name">MarKom Gateway</span>
            </div>
            <nav id="sidebar-nav" class="sidebar-nav" role="navigation" aria-label="Main navigation"></nav>
            <div class="sidebar-footer">
                <div id="sidebar-user" class="sidebar-user">
                    <div class="user-avatar" aria-hidden="true"></div>
                    <div class="user-info">
                        <div class="user-name"></div>
                        <div class="user-role"></div>
                    </div>
                </div>
            </div>
        </aside>
        <main id="main-content" class="main-content" role="main">
            <header id="top-bar" class="top-bar">
                <button id="sidebar-toggle" class="sidebar-toggle"
                        aria-label="Toggle navigation menu"
                        aria-expanded="false"
                        onclick="document.getElementById('sidebar').classList.toggle('open'); this.setAttribute('aria-expanded', document.getElementById('sidebar').classList.contains('open'))">
                    &#9776;
                </button>
                <h2 id="page-title" class="page-title">Home</h2>
                <div class="top-bar-actions">
                    <span id="time-range-selector" class="time-range-selector" style="display:none;">
                        <label for="time-range" class="sr-only">Time range</label>
                        <select id="time-range" aria-label="Select time range" onchange="window.__onTimeRangeChange && window.__onTimeRangeChange(this.value)">
                            <option value="7">7 days</option>
                            <option value="14">14 days</option>
                            <option value="30" selected>30 days</option>
                        </select>
                    </span>
                </div>
            </header>
            <div id="page-content" class="page-content" tabindex="-1"></div>
        </main>
    </div>
    <div id="modal-overlay" class="modal-overlay" style="display:none;"
         role="dialog" aria-modal="true" aria-label="Modal dialog"
         onclick="window.__closeModal && window.__closeModal()"></div>
    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
    <script src="/static/js/chart-setup.js"></script>
    <script src="/api.js"></script>
    <script src="/app.js"></script>
    <style>
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</body>
</html>
