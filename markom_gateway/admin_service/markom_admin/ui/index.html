<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarKom Gateway</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div id="app" class="layout">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo">M</div>
                <span class="brand-name">MarKom Gateway</span>
            </div>
            <nav id="sidebar-nav" class="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <div id="sidebar-user" class="sidebar-user">
                    <div class="user-avatar"></div>
                    <div class="user-info">
                        <div class="user-name"></div>
                        <div class="user-role"></div>
                    </div>
                </div>
            </div>
        </aside>
        <main id="main-content" class="main-content">
            <header id="top-bar" class="top-bar">
                <button id="sidebar-toggle" class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    &#9776;
                </button>
                <h2 id="page-title" class="page-title">Home</h2>
                <div class="top-bar-actions">
                    <span id="time-range-selector" class="time-range-selector" style="display:none;">
                        <select id="time-range" onchange="window.__onTimeRangeChange && window.__onTimeRangeChange(this.value)">
                            <option value="7">7 days</option>
                            <option value="14">14 days</option>
                            <option value="30" selected>30 days</option>
                        </select>
                    </span>
                </div>
            </header>
            <div id="page-content" class="page-content"></div>
        </main>
    </div>
    <div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="window.__closeModal && window.__closeModal()"></div>
    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/chart-setup.js"></script>
    <script src="/api.js"></script>
    <script src="/app.js"></script>
</body>
</html>
